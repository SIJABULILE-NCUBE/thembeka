<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b7a5d" />
    <title>Thembeka</title>
    <meta name="description" content="Send money home safely, with offline KYC and scam checks and a human approval step." />
    <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <a class="logo" href="#home" aria-label="Thembeka home">
          <img class="logo-mark" src="img/logo.svg" alt="" />
          Thembeka
        </a>
        <span id="offline-badge" class="badge-offline is-loading">Loading checks...</span>
      </header>

      <main id="screen" class="app-main" aria-live="polite"></main>

      <p class="footer-note">Demo app. All people, documents and money are fictional.</p>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
